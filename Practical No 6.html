<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Student Grade Calculator</title>    <!-- Tailwind CSS -->    <script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-gradient-to-br from-blue-100 to-purple-200              flex items-center justify-center p-5">    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl">        <!-- Heading -->        <div class="text-center mb-6">            <h1 class="text-3xl font-bold text-purple-700">                Student Grade Calculator            </h1>            <p class="text-gray-500 mt-2">                Enter marks to calculate the result            </p>        </div>        <!-- Input Fields -->        <div class="space-y-4">            <!-- Subject 1 -->            <div>                <label class="font-semibold text-gray-700">                    Subject 1                </label>                <input id="mark1" type="number" min="0" max="100"                    placeholder="Enter marks"                    class="w-full mt-1 p-3 border rounded-lg                    focus:outline-none focus:ring-2 focus:ring-purple-500">            </div>            <!-- Subject 2 -->            <div>                <label class="font-semibold text-gray-700">                    Subject 2                </label>                <input id="mark2" type="number" min="0" max="100"                    placeholder="Enter marks"                    class="w-full mt-1 p-3 border rounded-lg                    focus:outline-none focus:ring-2 focus:ring-purple-500">            </div>            <!-- Subject 3 -->            <div>                <label class="font-semibold text-gray-700">                    Subject 3                </label>                <input id="mark3" type="number" min="0" max="100"                    placeholder="Enter marks"                    class="w-full mt-1 p-3 border rounded-lg                    focus:outline-none focus:ring-2 focus:ring-purple-500">            </div>            <!-- Subject 4 -->            <div>                <label class="font-semibold text-gray-700">                    Subject 4                </label>                <input id="mark4" type="number" min="0" max="100"                    placeholder="Enter marks"                    class="w-full mt-1 p-3 border rounded-lg                    focus:outline-none focus:ring-2 focus:ring-purple-500">            </div>            <!-- Subject 5 -->            <div>                <label class="font-semibold text-gray-700">                    Subject 5                </label>                <input id="mark5" type="number" min="0" max="100"                    placeholder="Enter marks"                    class="w-full mt-1 p-3 border rounded-lg                    focus:outline-none focus:ring-2 focus:ring-purple-500">            </div>        </div>        <!-- Calculate Button -->        <button onclick="calculateGrade()"            class="w-full mt-6 bg-purple-600 text-white py-3 rounded-lg            font-bold hover:bg-purple-700 transition duration-300">            Calculate Result        </button>        <!-- Result Section -->        <div id="result"            class="hidden mt-6 p-5 bg-purple-50 rounded-xl text-center">            <h2 class="text-xl font-bold text-purple-700 mb-3">                Result            </h2>            <p class="text-gray-700">                Total Marks:                <span id="total" class="font-bold"></span>            </p>            <p class="text-gray-700 mt-2">                Percentage:                <span id="percentage" class="font-bold"></span>            </p>            <p class="text-gray-700 mt-2">                Grade:                <span id="grade"                    class="font-bold text-purple-600"></span>            </p>        </div>        <!-- Footer / Name -->        <footer class="text-center mt-8 pt-4 border-t border-gray-200">            <p class="text-gray-500 text-sm">                Created by            </p>            <p class="text-lg font-bold text-purple-600">                Mohd Muttasif            </p>        </footer>    </div>    <!-- JavaScript -->    <script>        function calculateGrade() {            // Get marks            let marks = [                Number(document.getElementById("mark1").value),                Number(document.getElementById("mark2").value),                Number(document.getElementById("mark3").value),                Number(document.getElementById("mark4").value),                Number(document.getElementById("mark5").value)            ];            // Check if marks are valid            if (marks.some(mark => mark < 0 || mark > 100)) {                alert("Please enter marks between 0 and 100.");                return;            }            // Calculate total            let total = marks.reduce(                (sum, mark) => sum + mark, 0            );            // Calculate percentage            let percentage = total / 5;            // Calculate grade            let grade;            if (percentage >= 90) {                grade = "A+";            } else if (percentage >= 80) {                grade = "A";            } else if (percentage >= 70) {                grade = "B";            } else if (percentage >= 60) {                grade = "C";            } else if (percentage >= 50) {                grade = "D";            } else {                grade = "F";            }            // Display result            document.getElementById("total").textContent =                total + " / 500";            document.getElementById("percentage").textContent =                percentage.toFixed(2) + "%";            document.getElementById("grade").textContent =                grade;            // Show result box            document.getElementById("result")                .classList.remove("hidden");        }    </script></body></html>
